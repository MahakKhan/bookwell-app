name: Keep Render awake

# Pings the app from GitHub's servers so it wakes up even if it was
# restarted, which the in-app timer (app/keepalive.server.ts) cannot do.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request /healthz (retries cover a cold start)
        run: |
          curl --silent --show-error --fail \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 90 \
            --output /dev/null --write-out "status=%{http_code} time=%{time_total}s\n" \
            https://bookwell-app.onrender.com/healthz
